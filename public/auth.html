<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Scratch Game</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    background: #1a0033;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .box {
    background: #000;
    padding: 25px;
    border-radius: 12px;
    width: 340px;
    text-align: center;
  }

  .box h3 {
    margin-bottom: 15px;
    color: #d4af37;
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #333;
    outline: none;
    font-size: 14px;
    background: #0a1929;
    color: white;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 6px;
    border: none;
    background: #008751;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }

  .link {
    margin-top: 12px;
    font-size: 12px;
    cursor: pointer;
    color: #ccc;
  }
  
  .link:hover {
    color: #d4af37;
  }
  
  .referral-note {
    font-size: 11px;
    color: #888;
    margin-top: 5px;
    text-align: left;
    padding: 0 5px;
  }
  
  .referral-note code {
    background: #d4af37;
    color: black;
    padding: 2px 5px;
    border-radius: 3px;
    font-weight: bold;
  }
  
  .mute-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    width: auto;
  }
  </style>
</head>
<body>

<button id="mute-btn" class="mute-btn">🔊</button>

<div class="box">
  <h3 id="title">LOGIN</h3>

  <!-- Phone field (shown only for register) -->
  <input id="phone" placeholder="Phone Number (numbers only)" style="display:none">
  
  <!-- Username field -->
  <input id="username" placeholder="Username (lowercase only)">
  
  <!-- Password field -->
  <input id="password" type="password" placeholder="Password">
  
  <!-- Referral Code field (shown only for register) -->
  <input id="referralCode" placeholder="Referral Code (e.g., ADMIN001)" style="display:none">
  <div id="referralNote" class="referral-note" style="display:none">
    Required. Use <code>ADMIN001</code> if you don't have a code
  </div>

  <button onclick="submit()">LOGIN</button>

  <div class="link" onclick="toggle()" id="toggleLink">Create account</div>
</div>

<!-- REMOVED THE DUPLICATE INPUT FIELD THAT WAS HERE -->

<script>
  const API = window.location.origin;
  let isRegister = false;

  function toggle() {
    isRegister = !isRegister;
    
    // Update title
    document.getElementById("title").innerText = isRegister ? "REGISTER" : "LOGIN";
    
    // Update button text
    document.querySelector("button").innerText = isRegister ? "REGISTER" : "LOGIN";
    
    // Update toggle link text
    document.getElementById("toggleLink").innerText = isRegister ? "Already have account? Login" : "Create account";
    
    // Show/hide phone field
    document.getElementById("phone").style.display = isRegister ? "block" : "none";
    
    // Show/hide referral code field
    document.getElementById("referralCode").style.display = isRegister ? "block" : "none";
    document.getElementById("referralNote").style.display = isRegister ? "block" : "none";
    
    // Pre-fill referral code for convenience
    if (isRegister) {
      document.getElementById("referralCode").value = "ADMINREFF001";
    } else {
      document.getElementById("referralCode").value = "";
    }
    
    // Clear fields when toggling
    if (!isRegister) {
      document.getElementById("phone").value = "";
      document.getElementById("referralCode").value = "";
    }
  }

  async function submit() {
    console.log("Submit button clicked");
    
    try {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const referralCode = document.getElementById("referralCode").value.trim();

      console.log("Form data:", { username, password, phone, referralCode, isRegister });
      
      // Validate required fields
      if (!username || !password) {
        alert("Username and password are required!");
        return;
      }
      
      if (isRegister) {
        // Registration validation
        if (!phone) {
          alert("Phone number is required for registration!");
          return;
        }
        
        if (!referralCode) {
          alert("Referral code is required for registration!");
          return;
        }
        
        // Validate phone (numbers only)
        if (!/^\d+$/.test(phone)) {
          alert("Phone must contain only numbers!");
          return;
        }
        
        // Validate username (lowercase only)
        if (!/^[a-z0-9_]+$/.test(username)) {
          alert("Username must be lowercase letters, numbers, or underscores only!");
          return;
        }
      }
      
      const endpoint = isRegister ? "/auth/register" : "/auth/login";
      console.log("API Endpoint:", API + endpoint);

      const payload = isRegister
        ? { phone, username, password, referralCode }
        : { username, password };

      console.log("Sending payload:", payload);

      const res = await fetch(API + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      console.log("Response status:", res.status);
      const data = await res.json();
      console.log("Response data:", data);

      if (!res.ok) {
        alert(data.message || "Action failed. Check console.");
        return;
      }

      // 🔑 LOGIN SUCCESS
      if (data.token) {
        console.log("✅ Token received");
        localStorage.setItem("token", data.token);
        
        if (isRegister) {
          alert("✅ Registration successful! Welcome!");
        }
        
        // Check if user already selected tier
        setTimeout(async () => {
          try {
            const checkResponse = await fetch(API + "/deposit/has-tier", {
              headers: { 
                "Authorization": `Bearer ${data.token}`,
                "Content-Type": "application/json"
              }
            });
            
            const checkData = await checkResponse.json();
            
            if (checkData.hasTier) {
              window.location.href = "game.html";
            } else {
              window.location.href = "select-tier.html";
            }
          } catch (error) {
            console.error("Check tier error:", error);
            window.location.href = "select-tier.html"; // Default to tier selection
          }
        }, 100);
      } else {
        console.error("No token in response:", data);
        alert("No token received. Check console.");
      }

    } catch (err) {
      console.error("Submit error:", err);
      alert("Action failed: " + err.message);
    }
  }
  
  // Allow Enter key to submit
  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      submit();
    }
  });
</script>

<script>
  // Audio for login/register pages
  (function() {
    console.log('🎵 Setting up page audio...');
    
    // Check mute preference
    const isMuted = localStorage.getItem('musicMuted') === 'true';
    
    // Create audio element
    const audio = new Audio('https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg');
    audio.loop = true;
    audio.volume = 0.3;
    audio.muted = isMuted;
    audio.load();
    
    // Update button
    const btn = document.getElementById('mute-btn');
    if (btn) {
        btn.innerHTML = isMuted ? '🔇' : '🔊';
        btn.style.color = isMuted ? '#888' : '#fff';
        btn.onclick = function() {
            const newMuted = !isMuted;
            localStorage.setItem('musicMuted', newMuted);
            audio.muted = newMuted;
            btn.innerHTML = newMuted ? '🔇' : '🔊';
            btn.style.color = newMuted ? '#888' : '#fff';
        };
    }
    
    // Start on ANY click
    const startOnClick = () => {
        if (!isMuted && audio.paused) {
            audio.play().then(() => {
                console.log('✅ Page music started');
            }).catch(e => {
                console.log('Page audio failed:', e.message);
            });
        }
    };
    
    document.addEventListener('click', startOnClick);
    document.addEventListener('touchstart', startOnClick);
    
    // Also try auto-start
    setTimeout(() => {
        if (!isMuted && audio.paused) {
            audio.play().catch(e => {
                console.log('Auto-start failed, waiting for click');
            });
        }
    }, 1500);
  })();
</script>

</body>
</html>
